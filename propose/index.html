<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>For Royce</title>
<meta name="theme-color" content="#c2185b">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    overflow: hidden;
    font-family: Georgia, 'Times New Roman', serif;
    background: linear-gradient(160deg, #3a0f1f, #7a1b3a 45%, #c2185b 100%);
    color: #fff0f3;
  }
  #app { position: relative; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; }

  /* floating hearts background */
  #hearts { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  .heart {
    position: absolute;
    bottom: -10vh;
    font-size: 20px;
    opacity: 0.55;
    animation: floatUp linear forwards;
    filter: drop-shadow(0 0 6px rgba(255,105,135,0.35));
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.6; }
    90%  { opacity: 0.5; }
    100% { transform: translateY(-110vh) translateX(var(--drift, 20px)) rotate(360deg); opacity: 0; }
  }

  .scene {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 24px;
    text-align: center;
    z-index: 2;
    opacity: 0;
    pointer-events: none;
    transform: scale(0.98);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .scene.active { opacity: 1; pointer-events: auto; transform: scale(1); }

  h1, h2 { margin: 0 0 12px; font-weight: 400; letter-spacing: 0.5px; }
  .title { font-size: clamp(28px, 8vw, 46px); }
  .subtitle { font-size: clamp(15px, 4vw, 18px); opacity: 0.85; margin-bottom: 28px; font-style: italic; }

  .btn {
    font-family: inherit;
    font-size: 17px;
    padding: 14px 34px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.12);
    color: #fff;
    backdrop-filter: blur(6px);
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .btn:active { transform: scale(0.96); }
  .btn.solid {
    background: #fff;
    color: #a3123a;
    border: none;
    font-weight: 600;
    box-shadow: 0 8px 22px rgba(0,0,0,0.25);
  }

  /* ---------- intro ---------- */
  .heart-icon { font-size: 46px; margin-bottom: 18px; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1);} 50% { transform: scale(1.12); } }

  /* ---------- poem ---------- */
  .poem { max-width: 480px; }
  .poem p {
    font-size: clamp(18px, 5vw, 24px);
    line-height: 1.6;
    margin: 0 0 14px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .poem p.show { opacity: 1; transform: translateY(0); }
  .continue-wrap { margin-top: 30px; opacity: 0; transition: opacity 0.6s ease; }
  .continue-wrap.show { opacity: 1; }

  /* ---------- gallery ---------- */
  .gallery-wrap { width: 100%; max-width: 420px; }
  .gallery-viewport {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 5;
    border-radius: 20px;
    overflow: hidden;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.25);
    box-shadow: 0 12px 30px rgba(0,0,0,0.3);
  }
  .slide {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    opacity: 0; transition: opacity 0.4s ease;
  }
  .slide.show { opacity: 1; }
  .slide img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
  .slide .placeholder {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 48px; opacity: 0.35;
  }
  .caption {
    position: relative;
    width: 100%;
    padding: 14px 16px 16px;
    background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
  }
  .cap-date {
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0.75;
    font-style: normal;
    margin-bottom: 3px;
  }
  .cap-activity {
    font-size: 15px;
    font-style: italic;
  }
  .gallery-nav { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 16px; }
  .nav-btn {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.4);
    color: #fff; width: 40px; height: 40px; border-radius: 50%;
    font-size: 18px; display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .dots { display: flex; gap: 7px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.35); transition: background 0.2s; }
  .dot.active { background: #fff; }

  /* ---------- buildup ---------- */
  .buildup p {
    font-size: clamp(18px, 5vw, 23px);
    line-height: 1.6;
    opacity: 0;
    transition: opacity 1s ease;
    max-width: 440px;
  }
  .buildup p.show { opacity: 1; }

  /* ---------- question ---------- */
  #question-scene { overflow: visible; }
  .question-title { font-size: clamp(26px, 7.5vw, 40px); margin-bottom: 40px; }
  .btn-row { position: relative; display: flex; gap: 18px; align-items: center; justify-content: center; height: 70px; width: 100%; flex-wrap: wrap; }

  /* ---------- celebration ---------- */
  .celebrate .heart-icon { font-size: 60px; }
  .celebrate .title { margin-bottom: 6px; }
  .celebrate .subtitle { font-style: normal; }

  canvas#confetti { position: fixed; inset: 0; z-index: 5; pointer-events: none; }

  .progress { position: fixed; top: 18px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; z-index: 4; }
  .progress span { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.25); }
  .progress span.done { background: rgba(255,255,255,0.85); }
</style>
</head>
<body>

<div id="app">
  <div id="hearts"></div>
  <div class="progress" id="progress"></div>

  <!-- Scene 1: Intro -->
  <section class="scene active" id="scene-intro">
    <div class="heart-icon">💌</div>
    <h1 class="title">To Royce</h1>
    <p class="subtitle">from your baby</p>
    <button class="btn solid" onclick="goTo('poem')">Open it</button>
  </section>

  <!-- Scene 2: Poem -->
  <section class="scene" id="scene-poem">
    <div class="poem" id="poemText"></div>
    <div class="continue-wrap" id="poemContinue">
      <button class="btn solid" onclick="goTo('gallery')">Keep going</button>
    </div>
  </section>

  <!-- Scene 3: Gallery -->
  <section class="scene" id="scene-gallery">
    <h2 class="title" style="font-size:clamp(20px,6vw,28px); margin-bottom:18px;">Look how far we've come</h2>
    <div class="gallery-wrap">
      <div class="gallery-viewport" id="galleryViewport"></div>
      <div class="gallery-nav">
        <div class="nav-btn" id="prevBtn">‹</div>
        <div class="dots" id="dots"></div>
        <div class="nav-btn" id="nextBtn">›</div>
      </div>
    </div>
    <div class="continue-wrap show" style="margin-top:26px;">
      <button class="btn solid" onclick="goTo('buildup')">Continue</button>
    </div>
  </section>

  <!-- Scene 4: Buildup -->
  <section class="scene buildup" id="scene-buildup">
    <div id="buildupText"></div>
  </section>

  <!-- Scene 5: The Question -->
  <section class="scene" id="scene-question">
    <div class="heart-icon">💗</div>
    <h1 class="question-title">Royce, will you<br>be my lady?</h1>
    <div class="btn-row">
      <button class="btn solid" id="yesBtn" onclick="sayYes('yes')">Yes</button>
      <button class="btn solid" id="doubleYesBtn" onclick="sayYes('double')">Double yes</button>
    </div>
  </section>

  <!-- Scene 6: Celebration -->
  <section class="scene celebrate" id="scene-celebrate">
    <div class="heart-icon">🎉</div>
    <h1 class="title" id="celebrateTitle">She said yes!</h1>
    <p class="subtitle" id="celebrateSubtitle">Best answer I've ever gotten. I love you, Royce.</p>
  </section>
</div>

<canvas id="confetti"></canvas>

<script>
/* ======================= EDIT ME ======================= */
const NAME = "Royce";

const POEM_LINES = [
  "We've been intertwined longer than we know,",
  "and I can't wait to see how far we go.",
  "Us finding each other felt unexpected,",
  "and it's the one thing I want most protected.",
  "I love you to the moon and back,",
  "then back to the moon, cause our love can't be kept within the stars.",
  "In the short time we've spent together,",
  "my baby, you've stolen my heart."
];

/* For each photo: fill in the date and what you two were doing. */
const PHOTOS = [
  { src: "photos/photo1.jpg", date: "Add the date", activity: "Add what we were doing" },
  { src: "photos/photo2.jpg", date: "Add the date", activity: "Add what we were doing" },
  { src: "photos/photo3.jpg", date: "Add the date", activity: "Add what we were doing" },
  { src: "photos/photo4.jpg", date: "Add the date", activity: "Add what we were doing" },
  { src: "photos/photo5.jpg", date: "Add the date", activity: "Add what we were doing" }
];

const BUILDUP_LINES = [
  "There's something I've been wanting to ask you.",
  "I've been building up to this for a while now.",
  "So, Royce…"
];
/* ================= END EDIT ME SECTION ================= */

document.title = "For " + NAME;

/* ---------- floating hearts background ---------- */
const heartsWrap = document.getElementById('hearts');
const heartEmojis = ['♥','❤','💗','💕'];
function spawnHeart() {
  const el = document.createElement('div');
  el.className = 'heart';
  el.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
  const left = Math.random() * 100;
  const size = 14 + Math.random() * 22;
  const duration = 7 + Math.random() * 6;
  const drift = (Math.random() * 80 - 40) + 'px';
  el.style.left = left + 'vw';
  el.style.fontSize = size + 'px';
  el.style.animationDuration = duration + 's';
  el.style.setProperty('--drift', drift);
  heartsWrap.appendChild(el);
  setTimeout(() => el.remove(), duration * 1000 + 200);
}
setInterval(spawnHeart, 550);
for (let i = 0; i < 6; i++) setTimeout(spawnHeart, i * 300);

/* ---------- scene navigation ---------- */
const SCENES = ['intro', 'poem', 'gallery', 'buildup', 'question', 'celebrate'];
const progressEl = document.getElementById('progress');
SCENES.slice(0, -1).forEach(() => {
  const dot = document.createElement('span');
  progressEl.appendChild(dot);
});

let currentScene = 'intro';
function goTo(name) {
  document.getElementById('scene-' + currentScene).classList.remove('active');
  document.getElementById('scene-' + name).classList.add('active');
  currentScene = name;

  const idx = SCENES.indexOf(name);
  [...progressEl.children].forEach((d, i) => d.classList.toggle('done', i <= idx));
  progressEl.style.display = (name === 'intro' || name === 'celebrate') ? 'none' : 'flex';

  if (name === 'poem') startPoem();
  if (name === 'buildup') startBuildup();
}
progressEl.style.display = 'none';

/* ---------- poem reveal ---------- */
let poemStarted = false;
function startPoem() {
  if (poemStarted) return;
  poemStarted = true;
  const container = document.getElementById('poemText');
  POEM_LINES.forEach((line, i) => {
    const p = document.createElement('p');
    p.textContent = line;
    container.appendChild(p);
    setTimeout(() => p.classList.add('show'), 300 + i * 850);
  });
  setTimeout(() => {
    document.getElementById('poemContinue').classList.add('show');
  }, 300 + POEM_LINES.length * 850 + 300);
}

/* ---------- gallery ---------- */
const viewport = document.getElementById('galleryViewport');
const dotsWrap = document.getElementById('dots');
let galleryIndex = 0;

PHOTOS.forEach((photo, i) => {
  const slide = document.createElement('div');
  slide.className = 'slide' + (i === 0 ? ' show' : '');

  const img = document.createElement('img');
  img.src = photo.src;
  img.alt = photo.activity || '';
  const placeholder = document.createElement('div');
  placeholder.className = 'placeholder';
  placeholder.textContent = '💗';
  placeholder.style.display = 'none';
  img.onerror = () => { img.style.display = 'none'; placeholder.style.display = 'flex'; };

  const cap = document.createElement('div');
  cap.className = 'caption';
  if (photo.date) {
    const dateEl = document.createElement('div');
    dateEl.className = 'cap-date';
    dateEl.textContent = photo.date;
    cap.appendChild(dateEl);
  }
  const activityEl = document.createElement('div');
  activityEl.className = 'cap-activity';
  activityEl.textContent = photo.activity || '';
  cap.appendChild(activityEl);

  slide.appendChild(img);
  slide.appendChild(placeholder);
  slide.appendChild(cap);
  viewport.appendChild(slide);

  const dot = document.createElement('div');
  dot.className = 'dot' + (i === 0 ? ' active' : '');
  dotsWrap.appendChild(dot);
});

function showSlide(i) {
  const slides = viewport.querySelectorAll('.slide');
  const dots = dotsWrap.querySelectorAll('.dot');
  slides[galleryIndex].classList.remove('show');
  dots[galleryIndex].classList.remove('active');
  galleryIndex = (i + PHOTOS.length) % PHOTOS.length;
  slides[galleryIndex].classList.add('show');
  dots[galleryIndex].classList.add('active');
}
document.getElementById('prevBtn').addEventListener('click', () => showSlide(galleryIndex - 1));
document.getElementById('nextBtn').addEventListener('click', () => showSlide(galleryIndex + 1));

let touchStartX = null;
viewport.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
viewport.addEventListener('touchend', e => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (dx > 40) showSlide(galleryIndex - 1);
  else if (dx < -40) showSlide(galleryIndex + 1);
  touchStartX = null;
});

/* ---------- buildup reveal ---------- */
let buildupStarted = false;
function startBuildup() {
  if (buildupStarted) return;
  buildupStarted = true;
  const container = document.getElementById('buildupText');
  BUILDUP_LINES.forEach((line, i) => {
    const p = document.createElement('p');
    p.textContent = line;
    container.appendChild(p);
    setTimeout(() => p.classList.add('show'), 400 + i * 1400);
  });
  setTimeout(() => goTo('question'), 400 + BUILDUP_LINES.length * 1400 + 900);
}

/* ---------- yes / double yes -> celebration ---------- */
const CELEBRATE_TEXT = {
  yes: {
    title: "She said yes!",
    subtitle: "Best answer I've ever gotten. I love you, Royce."
  },
  double: {
    title: "She said DOUBLE yes!",
    subtitle: "Couldn't just say it once. I love you, Royce."
  }
};

function sayYes(variant) {
  const text = CELEBRATE_TEXT[variant] || CELEBRATE_TEXT.yes;
  document.getElementById('celebrateTitle').textContent = text.title;
  document.getElementById('celebrateSubtitle').textContent = text.subtitle;
  goTo('celebrate');
  launchConfetti();
}

/* ---------- confetti ---------- */
const canvas = document.getElementById('confetti');
const ctx = canvas.getContext('2d');
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const colors = ['#ff6b8b', '#ffd166', '#ff9fb2', '#ffffff', '#ff477e'];
let particles = [];
function launchConfetti() {
  particles = [];
  for (let i = 0; i < 160; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * canvas.height * 0.5,
      size: 6 + Math.random() * 6,
      color: colors[Math.floor(Math.random() * colors.length)],
      speedY: 2 + Math.random() * 3,
      speedX: (Math.random() - 0.5) * 2,
      rotation: Math.random() * 360,
      spin: (Math.random() - 0.5) * 10,
      shape: Math.random() > 0.5 ? 'heart' : 'square'
    });
  }
  requestAnimationFrame(animateConfetti);
}
function animateConfetti() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let alive = false;
  particles.forEach(p => {
    p.y += p.speedY;
    p.x += p.speedX;
    p.rotation += p.spin;
    if (p.y < canvas.height + 20) alive = true;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate((p.rotation * Math.PI) / 180);
    ctx.fillStyle = p.color;
    if (p.shape === 'heart') {
      ctx.font = p.size * 2 + 'px serif';
      ctx.fillText('♥', -p.size / 2, p.size / 2);
    } else {
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
    }
    ctx.restore();
  });
  if (alive) requestAnimationFrame(animateConfetti);
  else ctx.clearRect(0, 0, canvas.width, canvas.height);
}
</script>
</body>
</html>
